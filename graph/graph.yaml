  # ---- decisions ------------------------------------------------------------

  - id: dec:2026-10-23-non-deletion-scope
    type: decision
    label: "Non-deletion scope: 'never deleted' covers only logged entries (aggregate discourse map and content-free records). Raw speech is erasable by crypto-shredding and each erasure is logged. Commitments must be salted (128-bit or more) or keyed. Pilot order: Alþingi transcripts, then one adult table; no raw recording of minors."
    created: 2026-10-23
    provenance: "Markús, docs/civic-contract-sketch.md, section 'Non-deletion scope (decided 2026-10-23)'"
    status: disputed
