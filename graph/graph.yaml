  # ---- conflicts (never resolved by the system) -----------------------------

  - id: cnf:commitments-as-personal-data
    type: conflict
    label: "The decision keeps salted commitments permanently. EDPB Guidelines 02/2025 treat salted or keyed hashes as personal data, and whether a commitment stops being personal data once content and salt are destroyed is unsettled (EDPS v SRB, C-413/23 P). Legal, unverified."
    created: 2026-10-23
    provenance: "Markús, docs/civic-contract-sketch.md"
    status: active
    verification_tier: n/a
    verification_status: not-verified
    retention: permanent

  - id: cnf:erasure-vs-audit-trail
    type: conflict
    label: "Verifiability wants a record of who stood behind a claim; the non-deletion decision makes raw speech erasable. The sketch's answer is a content-free erasure record in the log, which proves that something was removed but not what."
    created: 2026-10-23
    provenance: "primitives.md read against docs/civic-contract-sketch.md"
    status: active
    verification_tier: n/a
    verification_status: self-description
    retention: permanent

  - id: cnf:speaker-level-scores
    type: conflict
    label: "Slides 6 and 8 keep on-demand speaker-level scores. docs/challengeable-flags.md asks whether any speaker-level score resolves disagreement on the reader's behalf, against the disagreement-preserved primitive and rule (c) in agents.md."
