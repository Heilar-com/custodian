    created: 2026-10-23
    provenance: "Markús, docs/civic-contract-sketch.md (RFC 6962 / RFC 9162, C2SP tlog)"
    status: active
    verification_tier: n/a
    verification_status: self-description
    retention: permanent

  # ---- decisions ------------------------------------------------------------

  - id: dec:2026-10-23-non-deletion-scope
    type: decision
    label: "Non-deletion scope: 'never deleted' covers only logged entries (aggregate discourse map and content-free records). Raw speech is erasable by crypto-shredding and each erasure is logged. Commitments must be salted (128-bit or more) or keyed. Pilot order: Alþingi transcripts, then one adult table; no raw recording of minors."
    created: 2026-10-23
    provenance: "Markús, docs/civic-contract-sketch.md, section 'Non-deletion scope (decided 2026-10-23)'"
    status: active
    verification_tier: n/a
    verification_status: self-description
    retention: permanent

  # ---- conflicts (never resolved by the system) -----------------------------

  - id: cnf:commitments-as-personal-data
    type: conflict
    label: "The decision keeps salted commitments permanently. EDPB Guidelines 02/2025 treat salted or keyed hashes as personal data, and whether a commitment stops being personal data once content and salt are destroyed is unsettled (EDPS v SRB, C-413/23 P). Legal, unverified."
    created: 2026-10-23
    provenance: "Markús, docs/civic-contract-sketch.md; recorded as a node by Claude Fable 5.1"
    status: active
    verification_tier: n/a
    verification_status: not-verified
    retention: permanent

  - id: cnf:erasure-vs-audit-trail
    type: conflict
    label: "Verifiability wants a record of who stood behind a claim; the non-deletion decision makes raw speech erasable. The sketch's answer is a content-free erasure record in the log, which proves that something was removed but not what."
    created: 2026-10-23
    provenance: "Claude Fable 5.1, reading primitives.md against docs/civic-contract-sketch.md"
    status: active
    verification_tier: n/a
    verification_status: self-description
    retention: permanent

  - id: cnf:speaker-level-scores
    type: conflict
    label: "Slides 6 and 8 keep on-demand speaker-level scores. docs/challengeable-flags.md asks whether any speaker-level score resolves disagreement on the reader's behalf, against the disagreement-preserved primitive and rule (c) in agents.md."
    created: 2026-10-23
    provenance: "Markús, docs/challengeable-flags.md open question; recorded as a node by Claude Fable 5.1"
    status: active
    verification_tier: n/a
    verification_status: self-description
    retention: permanent

  - id: cnf:conflict-edge-type
    type: conflict
    label: "The schema says both sides of a multi-node tension 'point to' a conflict node but defines no edge type for that. This file uses `cites`. A decision should either add an edge type or confirm `cites`."
    created: 2026-10-23
    provenance: "Claude Fable 5.1, while seeding this file against docs/graph-schema.md"
    status: active
    verification_tier: n/a
    verification_status: self-description
    retention: permanent

