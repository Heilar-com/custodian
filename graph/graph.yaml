  # ---- decision 2026-10-25: provenance means publisher -----------------------

  - id: dec:2026-10-25-provenance-means-publisher
    type: decision
    label: "Provenance names who stands behind the content: the publisher, institution or author group of a source; the source or repo document a claim is taken from. Never the agent or model that typed the node. The graph tracks information, not models; git history records who committed a node. Decided by Markús 2026-10-25."
    created: 2026-10-25
    provenance: "Markús, review of graph/check.py (PR 19), 2026-10-25"
    status: active
    verification_tier: n/a
    verification_status: self-description
    retention: permanent

  - id: cnf:recorder-trail-outside-graph
    type: conflict
    label: "Verifiability wants a record of who stood behind a claim, including who entered it. The provenance decision moves the recorder (person, agent, model) out of the graph into git history, so the graph alone cannot show who typed a node. Detector flags keep detector name and version in their own fields (docs/challengeable-flags.md)."
    created: 2026-10-25
    provenance: "primitives.md read against dec:2026-10-25-provenance-means-publisher"
    status: active
    verification_tier: n/a
    verification_status: self-description
    retention: permanent

  - id: dec:2026-10-25-agents-may-merge
    type: decision
    label: "Any agent or session may merge a PR once it is mergeable and follows agents.md. The repo is a research notebook, not a running system; waiting on one person blocked the work. The later of two PRs touching one file resolves the conflict."
    created: 2026-10-25
    provenance: "Markús, chat of 2026-10-25; recorded in agents.md rule (g), PR 20"
    status: disputed
    verification_tier: n/a
    verification_status: self-description
    retention: permanent

  - id: dec:2026-10-25-split-licence
    type: decision
    label: "Written content is CC BY 4.0; code (source, scripts, configs) is AGPL-3.0, following Pol.is and Agora. LICENSE lists paths and file types. Licence texts are verbatim official copies."
    created: 2026-10-25
    provenance: "Markús, PR 6 (docs/licensing), merged 2026-10-25"
    status: disputed
    verification_tier: n/a
    verification_status: self-description
    retention: permanent

  - id: cnf:no-second-reader
    type: conflict
    label: "Merging without a second reader speeds the notebook but removes the one check on the rule to cite nothing unchecked. The mitigation so far is the checker (graph/check.py) and verification markers in the index; neither reads prose."
    created: 2026-10-25
    provenance: "Markús, agents.md rules (g) and the cite-nothing-unchecked rule; tension named by Claude Fable 5.1 in PR, 2026-10-25"
    status: active
    verification_tier: n/a
    verification_status: self-description
    retention: permanent

  - id: cnf:graph-yaml-licence
    type: conflict
    label: "LICENSE puts .yaml files under AGPL-3.0 as configs, but graph/graph.yaml is the research record (claims, sources, decisions), which the licence intends to be CC BY 4.0. Which licence covers the graph data is undecided."
    created: 2026-10-25
    provenance: "LICENSE (PR 6) read against graph/graph.yaml; tension named by Claude Fable 5.1, 2026-10-25"
    status: active
    verification_tier: n/a
    verification_status: self-description
    retention: permanent

