# Custodian graph: seed data
#
# Follows docs/graph-schema.md. graph/check.py validates it and computes axiom-candidate status.
# Seeded 2026-10-23 from docs/research/prior-art-index.md (checked 2026-10-23)
# and the non-deletion decision in docs/civic-contract-sketch.md.
#
# Conventions used here, to be confirmed or changed by a later decision:
# - verification_status on nodes that are not sources: `self-description`
#   (the project's own statement about itself), per the schema's marker set.
# - A claim with no supporting source has verification_tier `n/a` and
#   verification_status `not-verified`, and no incoming `supports` edge.
# - axiom-candidate is never written by hand. No node here carries that type;
#   a script recomputes it from `supports` edges and tiers.
# - Where a tension involves more than two nodes, each side points at the
#   `conflict` node with a `cites` edge. The schema has no dedicated edge for
#   this yet; that gap is itself recorded below (cnf:conflict-edge-type).
# - Nothing here is per-speaker data, so every node has retention `permanent`.
# - provenance names who stands behind the content: the publisher, institution
#   or author group of a source; the index entry or repo document a claim or
#   edge comes from. Never the agent or model that typed the node; git history
#   records that (dec:2026-10-25-provenance-means-publisher). Spell one
#   organisation one way, since the axiom rule compares the strings.

